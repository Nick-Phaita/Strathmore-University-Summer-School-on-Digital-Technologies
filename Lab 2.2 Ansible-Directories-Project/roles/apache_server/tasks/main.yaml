---

- name: Install Apache packages
  become: yes
  apt:
    name: apache2
    state: present

- name: Ensure Apache is started and enabled
  service:
    name: apache2
    state: started
    enabled: true

- name: Deploy index.html
  copy:
    content: "Welcome to my automated and deployed web server!"
    dest: /var/www/html/index.html

- name: Ensure firewalld is installed and running
  apt:
    name: firewalld
    state: present
  notify: Restart Firewall

- name: Open firewall port 80
  firewalld:
    port: "80/tcp"
    permanent: true
    state: enabled
  notify: Restart Firewall

- name: Test the webserver locally
  uri:
    url: "http://localhost:80"
    status_code: 200
  register: web_test

- name: Display test result
  debug:
    msg: "Server is up and running!"